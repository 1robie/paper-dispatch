name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Notify build started
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg workflow "${{ github.workflow }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg sha "$SHA_SHORT" \
            --arg url "$RUN_URL" \
            '{embeds:[{title:"Build started",color:15844367,fields:[{name:"Workflow",value:$workflow,inline:true},{name:"Ref",value:$ref,inline:true},{name:"Commit",value:$sha,inline:true},{name:"Actor",value:$actor,inline:true},{name:"Run",value:$url}]}]}' \
            > payload.json
          curl -sS -f -o /dev/null -H "Content-Type: application/json" \
            -d @payload.json "$DISCORD_WEBHOOK_URL"

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          retention-days: 7

      - name: Notify build success
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg workflow "${{ github.workflow }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg sha "$SHA_SHORT" \
            --arg url "$RUN_URL" \
            '{embeds:[{title:"Build passed",color:3066993,fields:[{name:"Workflow",value:$workflow,inline:true},{name:"Ref",value:$ref,inline:true},{name:"Commit",value:$sha,inline:true},{name:"Run",value:$url}]}]}' \
            > payload.json
          curl -sS -f -o /dev/null -H "Content-Type: application/json" \
            -d @payload.json "$DISCORD_WEBHOOK_URL"

      - name: Notify build failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg workflow "${{ github.workflow }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg sha "$SHA_SHORT" \
            --arg url "$RUN_URL" \
            '{embeds:[{title:"Build failed",color:15158332,fields:[{name:"Workflow",value:$workflow,inline:true},{name:"Ref",value:$ref,inline:true},{name:"Commit",value:$sha,inline:true},{name:"Actor",value:$actor,inline:true},{name:"Run",value:$url}]}]}' \
            > payload.json
          curl -sS -f -o /dev/null -H "Content-Type: application/json" \
            -d @payload.json "$DISCORD_WEBHOOK_URL"
