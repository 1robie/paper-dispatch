name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 21 is the release target; 25 is what CodeQL and JitPack build with. Testing both
        # catches toolchain-specific breakage (e.g. an outdated byte-buddy on a newer JDK)
        # rather than discovering it on a release build.
        java: ["21", "25"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
          cache: "maven"

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: "**/target/surefire-reports/**"
          retention-days: 7
