name: "Discord notify"
description: "Render a Components V2 payload from a template and post or edit it via webhook."

inputs:
  webhook:
    description: "Discord webhook URL. When empty the action does nothing and succeeds."
    required: false
    default: ""
  template:
    description: "Path to the JSON template containing {placeholder} tokens."
    required: true
  values:
    description: "JSON object of placeholder name to replacement value."
    required: true
  message-id:
    description: "Existing message to edit. When empty, a new message is posted."
    required: false
    default: ""
  username:
    description: >-
      Display name to post under, overriding the webhook's configured name. Applied only when
      creating a message: Discord does not accept username on an edit, so a message that is
      later edited keeps the name it was posted with. Empty uses the webhook's own name.
    required: false
    default: ""
  avatar-url:
    description: >-
      Avatar image URL to post with, overriding the webhook's configured avatar. Same
      create-only restriction as `username`. Empty uses the webhook's own avatar.
    required: false
    default: ""

outputs:
  message-id:
    description: "The id of the posted or edited message, empty if nothing was sent."
    value: ${{ steps.send.outputs.message-id }}

runs:
  using: composite
  steps:
    - id: send
      shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
        TEMPLATE: ${{ inputs.template }}
        VALUES: ${{ inputs.values }}
        MESSAGE_ID: ${{ inputs.message-id }}
        USERNAME: ${{ inputs.username }}
        AVATAR_URL: ${{ inputs.avatar-url }}
      run: |
        set -uo pipefail

        if [ -z "$WEBHOOK" ]; then
          echo "No webhook configured (expected on forked pull requests) - skipping."
          echo "message-id=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        jq --argjson vals "$VALUES" '
          def render($vals):
            walk(
              if type == "string" then
                reduce ($vals | to_entries[]) as $e (
                  .;
                  split("{" + $e.key + "}") | join($e.value | tostring)
                )
              else . end
            );
          render($vals)
        ' "$TEMPLATE" > payload.json

        if ! jq -e . payload.json > /dev/null; then
          echo "::error::Rendered payload is not valid JSON"
          exit 1
        fi

        jq --arg username "$USERNAME" --arg avatar "$AVATAR_URL" '
          . + (if $username == "" then {} else {username: $username} end)
            + (if $avatar   == "" then {} else {avatar_url: $avatar} end)
        ' payload.json > payload.post.json

        post_new() {
          curl -sS -X POST "$WEBHOOK?wait=true&with_components=true" \
            -H "Content-Type: application/json" \
            --data @payload.post.json \
            --max-time 30 --retry 2 --retry-connrefused
        }

        if [ -n "$MESSAGE_ID" ]; then
          if RESPONSE=$(curl -sS -f -X PATCH "$WEBHOOK/messages/$MESSAGE_ID?with_components=true" \
                -H "Content-Type: application/json" \
                --data @payload.json \
                --max-time 30 --retry 2 --retry-connrefused); then
            echo "message-id=$MESSAGE_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Editing message $MESSAGE_ID failed; posting a new message instead."
          RESPONSE=$(post_new)
        else
          RESPONSE=$(post_new)
        fi

        NEW_ID=$(printf '%s' "$RESPONSE" | jq -r '.id // empty')
        echo "message-id=$NEW_ID" >> "$GITHUB_OUTPUT"

        if [ -z "$NEW_ID" ]; then
          echo "::error::Discord rejected the message. Response: $(printf '%s' "$RESPONSE" | head -c 500)"
          exit 1
        fi
        echo "Sent message $NEW_ID."
