version: 2
updates:
  # Every dependency version lives in the root pom's dependencyManagement, so that is the
  # directory to watch. Pointing this at /Lib/src (as it previously did) found nothing to
  # update, because that module pins no versions of its own.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
